<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420" role="img" aria-label="Portfólio: danbrkz.ink">
  <defs>
    <style>
      .t { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
      .m { font-family: ui-monospace, SFMono-Regular, Consolas, Menlo, monospace; }
    </style>
    <radialGradient id="glow" cx="1" cy="0" r="0.85">
      <stop offset="0" stop-color="#FF6B3D" stop-opacity=".30"/>
      <stop offset="1" stop-color="#FF6B3D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx=".85" cy=".2" r=".6">
      <stop offset="0" stop-color="#FF6B3D" stop-opacity=".45"/>
      <stop offset="1" stop-color="#FF6B3D" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="1.2" fill="#26262B"/></pattern>
    <clipPath id="card"><rect width="600" height="420" rx="28"/></clipPath>
    <clipPath id="janela"><rect width="300" height="320" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="600" height="420" fill="#111113"/>
    <rect x="320" width="280" height="420" fill="url(#dots)"/>
    <rect width="600" height="420" fill="url(#glow)"/>

    <text x="40" y="70" class="m" font-size="14" letter-spacing="2" fill="#FF6B3D">03 · PORTFÓLIO</text>
    <text x="40" y="118" class="t" font-size="36" font-weight="700" fill="#F1EFEA" letter-spacing="-.8">danbrkz.ink</text>
    <text x="40" y="160" class="t" font-size="20" fill="#A8A49B">Meu site, com os</text>
    <text x="40" y="188" class="t" font-size="20" fill="#A8A49B">projetos, as tecnologias</text>
    <text x="40" y="216" class="t" font-size="20" fill="#A8A49B">e o contato.</text>

    <rect x="40" y="246" width="170" height="32" rx="16" fill="#F1EFEA"/>
    <text x="125" y="267" class="t" font-size="15" font-weight="700" fill="#111113" text-anchor="middle">Visitar o site ↗</text>

    <g class="m" font-size="14" fill="#CFCBC3">
      <rect x="40" y="338" width="60" height="30" rx="15" fill="#1F1F23"/><text x="70" y="358" text-anchor="middle">HTML</text>
      <rect x="110" y="338" width="52" height="30" rx="15" fill="#1F1F23"/><text x="136" y="358" text-anchor="middle">CSS</text>
      <rect x="172" y="338" width="110" height="30" rx="15" fill="#1F1F23"/><text x="227" y="358" text-anchor="middle">JavaScript</text>
    </g>

    <!-- Mini navegador com o portfólio -->
    <g transform="translate(336 58) rotate(3 150 160)">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 -9;0 0" dur="6.5s" repeatCount="indefinite"/>
      <rect width="300" height="320" rx="14" fill="#0E0E0F" stroke="#2B2B30"/>
      <g clip-path="url(#janela)">
        <rect width="300" height="320" fill="url(#glow2)"/>
        <circle cx="16" cy="16" r="4.5" fill="#333"/><circle cx="30" cy="16" r="4.5" fill="#333"/><circle cx="44" cy="16" r="4.5" fill="#333"/>
        <rect x="62" y="8" width="120" height="16" rx="8" fill="#1F1F23"/>
        <text x="122" y="20" class="m" font-size="9.5" fill="#9C988F" text-anchor="middle">danbrkz.ink</text>
        <line x1="0" y1="32" x2="300" y2="32" stroke="#1F1F23"/>

        <rect x="20" y="48" width="26" height="26" rx="8" fill="#F1EFEA"/>
        <text x="33" y="65.5" class="t" font-size="11" font-weight="800" fill="#0E0E0F" text-anchor="middle">DH</text>
        <rect x="54" y="56" width="70" height="10" rx="5" fill="#2B2B30"/>

        <rect x="20" y="92" width="118" height="20" rx="10" fill="#17171A" stroke="#2B2B30"/>
        <circle cx="31" cy="102" r="3" fill="#3DD68C">
          <animate attributeName="opacity" values="1;.35;1" dur="2s" repeatCount="indefinite"/>
        </circle>
        <text x="40" y="105.5" class="t" font-size="8.5" fill="#CFCBC3">Disponível para projetos</text>

        <text x="20" y="150" class="t" font-size="30" font-weight="800" fill="#F1EFEA" letter-spacing="-1">Olá, eu sou</text>
        <text x="20" y="184" class="t" font-size="30" font-weight="800" fill="#FF6B3D" letter-spacing="-1">Daniel</text>
        <text x="20" y="218" class="t" font-size="30" font-weight="800" fill="#FF6B3D" letter-spacing="-1">Henrique.</text>

        <rect x="20" y="236" width="230" height="8" rx="4" fill="#2B2B30"/>
        <rect x="20" y="252" width="190" height="8" rx="4" fill="#2B2B30"/>
        <rect x="20" y="276" width="86" height="26" rx="13" fill="#F1EFEA"/>
        <rect x="114" y="276" width="86" height="26" rx="13" fill="none" stroke="#2B2B30"/>
      </g>
    </g>
  </g>
  <rect x=".5" y=".5" width="599" height="419" rx="28" fill="none" stroke="#2B2B30"/>
</svg>
