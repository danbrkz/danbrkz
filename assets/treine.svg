<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420" role="img" aria-label="Treinê: gestor de treinos">
  <defs>
    <style>
      .t { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
      .m { font-family: ui-monospace, SFMono-Regular, Consolas, Menlo, monospace; }
    </style>
    <radialGradient id="glow" cx="1" cy="1" r="0.8">
      <stop offset="0" stop-color="#FF6B3D" stop-opacity=".22"/>
      <stop offset="1" stop-color="#FF6B3D" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="1.2" fill="#26262B"/></pattern>
    <clipPath id="card"><rect width="600" height="420" rx="28"/></clipPath>
    <clipPath id="tela"><rect x="8" y="8" width="174" height="384" rx="23"/></clipPath>
    <clipPath id="foto"><rect x="26" y="96" width="138" height="84" rx="10"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="600" height="420" fill="#111113"/>
    <rect x="340" width="260" height="420" fill="url(#dots)"/>
    <rect width="600" height="420" fill="url(#glow)"/>

    <text x="40" y="70" class="m" font-size="14" letter-spacing="2" fill="#FF6B3D">03 · GESTOR DE TREINOS</text>
    <text x="40" y="118" class="t" font-size="36" font-weight="700" fill="#F1EFEA" letter-spacing="-.8">Treinê</text>
    <text x="40" y="160" class="t" font-size="20" fill="#A8A49B">Treinos, cargas e</text>
    <text x="40" y="188" class="t" font-size="20" fill="#A8A49B">descanso entre séries,</text>
    <text x="40" y="216" class="t" font-size="20" fill="#A8A49B">com ranking entre amigos.</text>

    <rect x="40" y="246" width="214" height="32" rx="16" fill="#1F1F23"/>
    <text x="147" y="267" class="m" font-size="14" fill="#F1EFEA" text-anchor="middle">danbrkz.ink/treino ↗</text>

    <g class="m" font-size="14" fill="#CFCBC3">
      <rect x="40" y="338" width="52" height="30" rx="15" fill="#1F1F23"/><text x="66" y="358" text-anchor="middle">PHP</text>
      <rect x="102" y="338" width="52" height="30" rx="15" fill="#1F1F23"/><text x="128" y="358" text-anchor="middle">PWA</text>
      <rect x="164" y="338" width="78" height="30" rx="15" fill="#1F1F23"/><text x="203" y="358" text-anchor="middle">Offline</text>
    </g>

    <!-- Celular com o app -->
    <g transform="translate(372 46) rotate(4 95 200)">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 -10;0 0" dur="6s" repeatCount="indefinite"/>
      <rect width="190" height="400" rx="30" fill="#0B0B0C" stroke="#2A2A2E"/>
      <rect x="8" y="8" width="174" height="384" rx="23" fill="#0E0E0F"/>
      <g clip-path="url(#tela)" class="t">
        <rect x="65" y="8" width="60" height="14" rx="7" fill="#0B0B0C"/>
        <text x="20" y="44" font-size="8.5" letter-spacing="1" fill="#9C988F">TREINO DE HOJE</text>
        <text x="20" y="64" font-size="19" font-weight="800" fill="#F1EFEA">Treino A</text>
        <rect x="128" y="44" width="42" height="18" rx="9" fill="#FF6B3D" fill-opacity=".16"/>
        <text x="149" y="57" class="m" font-size="9.5" fill="#FF8A63" text-anchor="middle">1 de 3</text>

        <rect x="18" y="80" width="154" height="236" rx="14" fill="#17171A"/>
        <rect x="26" y="96" width="138" height="84" rx="10" fill="#FFFFFF"/>
        <image clip-path="url(#foto)" href="data:image/webp;base64," x="26" y="96" width="138" height="84" preserveAspectRatio="xMidYMid meet"/>
        <text x="26" y="198" font-size="11.5" font-weight="700" fill="#F1EFEA">Agachamento livre</text>

        <rect x="26" y="208" width="138" height="26" rx="8" fill="#212125"/>
        <text x="36" y="225" class="m" font-size="9" fill="#9C988F">1</text><text x="52" y="225" class="m" font-size="10" fill="#CFCBC3">60 kg × 10</text><text x="150" y="226" font-size="12" font-weight="700" fill="#3DD68C" text-anchor="middle">✓</text>
        <rect x="26" y="240" width="138" height="26" rx="8" fill="#212125"/>
        <text x="36" y="257" class="m" font-size="9" fill="#9C988F">2</text><text x="52" y="257" class="m" font-size="10" fill="#CFCBC3">70 kg × 8</text><text x="150" y="258" font-size="12" font-weight="700" fill="#3DD68C" text-anchor="middle">✓</text>

        <!-- série 3: começa "agora" (laranja) e é marcada como feita -->
        <rect x="26" y="272" width="138" height="26" rx="8" fill="#212125"/>
        <rect x="26" y="272" width="138" height="26" rx="8" fill="#FF6B3D" fill-opacity=".16" stroke="#FF6B3D" stroke-opacity=".5">
          <animate attributeName="opacity" values="1;0" keyTimes="0;.25" calcMode="discrete" dur="8s" repeatCount="indefinite"/>
        </rect>
        <text x="36" y="289" class="m" font-size="9" fill="#9C988F">3</text><text x="52" y="289" class="m" font-size="10" fill="#F1EFEA">80 kg × 6</text>
        <circle cx="150" cy="285" r="5.5" fill="none" stroke="#FF6B3D" stroke-width="1.5">
          <animate attributeName="opacity" values="1;0" keyTimes="0;.25" calcMode="discrete" dur="8s" repeatCount="indefinite"/>
        </circle>
        <circle cx="150" cy="285" r="2" fill="#FF6B3D" opacity="0">
          <animate attributeName="r" values="2;2;14;14" keyTimes="0;.22;.32;1" dur="8s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;.6;0;0" keyTimes="0;.22;.32;1" dur="8s" repeatCount="indefinite"/>
        </circle>
        <text x="150" y="290" font-size="12" font-weight="700" fill="#3DD68C" text-anchor="middle" opacity="0">✓<animate attributeName="opacity" values="0;1" keyTimes="0;.25" calcMode="discrete" dur="8s" repeatCount="indefinite"/></text>

        <!-- descanso: acende e começa a contar depois da série -->
        <rect x="18" y="324" width="154" height="44" rx="14" fill="#17171A"/>
        <rect x="18" y="324" width="154" height="44" rx="14" fill="#1F1F23" stroke="#FF6B3D" stroke-opacity=".45" opacity="0">
          <animate attributeName="opacity" values="0;1" keyTimes="0;.31" calcMode="discrete" dur="8s" repeatCount="indefinite"/>
        </rect>
        <circle cx="40" cy="346" r="11" fill="none" stroke="#2C2C31" stroke-width="3.5"/>
        <circle cx="40" cy="346" r="11" fill="none" stroke="#FF6B3D" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="69.1" stroke-dashoffset="0" transform="rotate(-90 40 346)">
          <animate attributeName="stroke-dashoffset" values="0;0;12" keyTimes="0;.31;1" dur="8s" repeatCount="indefinite"/>
        </circle>
        <text x="62" y="340" font-size="8" fill="#9C988F">Descanso</text>
        <text x="62" y="355" class="m" font-size="14" font-weight="700" fill="#FF8A63" opacity="1">1:30<animate attributeName="opacity" values="1;0" keyTimes="0;0.375" calcMode="discrete" dur="8s" repeatCount="indefinite"/></text>
        <text x="62" y="355" class="m" font-size="14" font-weight="700" fill="#FF8A63" opacity="0">1:29<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.375;0.5" calcMode="discrete" dur="8s" repeatCount="indefinite"/></text>
        <text x="62" y="355" class="m" font-size="14" font-weight="700" fill="#FF8A63" opacity="0">1:28<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;0.625" calcMode="discrete" dur="8s" repeatCount="indefinite"/></text>
        <text x="62" y="355" class="m" font-size="14" font-weight="700" fill="#FF8A63" opacity="0">1:27<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.625;0.75" calcMode="discrete" dur="8s" repeatCount="indefinite"/></text>
        <text x="62" y="355" class="m" font-size="14" font-weight="700" fill="#FF8A63" opacity="0">1:26<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.75;0.875" calcMode="discrete" dur="8s" repeatCount="indefinite"/></text>
        <text x="62" y="355" class="m" font-size="14" font-weight="700" fill="#FF8A63" opacity="0">1:25<animate attributeName="opacity" values="0;1" keyTimes="0;0.875" calcMode="discrete" dur="8s" repeatCount="indefinite"/></text>
        <rect x="128" y="335" width="36" height="22" rx="11" fill="#F1EFEA"/>
        <text x="146" y="350" font-size="9" font-weight="700" fill="#141414" text-anchor="middle">Pular</text>
      </g>
    </g>
  </g>
  <rect x=".5" y=".5" width="599" height="419" rx="28" fill="none" stroke="#2B2B30"/>
</svg>
