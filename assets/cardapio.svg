<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420" role="img" aria-label="Cardápio digital: aberto pelo celular, editado no sistema">
  <defs>
    <style>
      .t { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
      .m { font-family: ui-monospace, SFMono-Regular, Consolas, Menlo, monospace; }
    </style>
    <radialGradient id="glow" cx="1" cy="1" r="0.8">
      <stop offset="0" stop-color="#FF6B3D" stop-opacity=".22"/>
      <stop offset="1" stop-color="#FF6B3D" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="1.2" fill="#26262B"/></pattern>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2C2C30"/><stop offset="1" stop-color="#0F0F11"/></linearGradient>
    <linearGradient id="t1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7B267"/><stop offset="1" stop-color="#E4572E"/></linearGradient>
    <linearGradient id="t2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9BE7C4"/><stop offset="1" stop-color="#2E8B6B"/></linearGradient>
    <linearGradient id="t3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4E285"/><stop offset="1" stop-color="#C9A227"/></linearGradient>
    <linearGradient id="t4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B8A9F5"/><stop offset="1" stop-color="#5B4BC4"/></linearGradient>
    <clipPath id="card"><rect width="600" height="420" rx="28"/></clipPath>
    <clipPath id="tela"><rect x="8" y="8" width="174" height="384" rx="23"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="600" height="420" fill="#111113"/>
    <rect x="340" width="260" height="420" fill="url(#dots)"/>
    <rect width="600" height="420" fill="url(#glow)"/>

    <text x="40" y="70" class="m" font-size="14" letter-spacing="2" fill="#FF6B3D">02 · CARDÁPIO DIGITAL</text>
    <text x="40" y="118" class="t" font-size="36" font-weight="700" fill="#F1EFEA" letter-spacing="-.8">Cardápio digital</text>
    <text x="40" y="160" class="t" font-size="20" fill="#A8A49B">Aberto pelo celular,</text>
    <text x="40" y="188" class="t" font-size="20" fill="#A8A49B">editado direto no sistema,</text>
    <text x="40" y="216" class="t" font-size="20" fill="#A8A49B">com fotos e preços.</text>

    <rect x="40" y="246" width="214" height="32" rx="16" fill="#1F1F23"/>
    <text x="147" y="267" class="m" font-size="14" fill="#F1EFEA" text-anchor="middle">auralounge.com.br ↗</text>

    <g class="m" font-size="14" fill="#CFCBC3">
      <rect x="40" y="338" width="52" height="30" rx="15" fill="#1F1F23"/><text x="66" y="358" text-anchor="middle">PHP</text>
      <rect x="102" y="338" width="110" height="30" rx="15" fill="#1F1F23"/><text x="157" y="358" text-anchor="middle">JavaScript</text>
      <rect x="222" y="338" width="78" height="30" rx="15" fill="#1F1F23"/><text x="261" y="358" text-anchor="middle">Mobile</text>
    </g>

    <!-- Celular -->
    <g transform="translate(372 46) rotate(4 95 200)">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0 0;0 -10;0 0" dur="6s" repeatCount="indefinite"/>
      <rect width="190" height="400" rx="30" fill="#0B0B0C" stroke="#2A2A2E"/>
      <rect x="8" y="8" width="174" height="384" rx="23" fill="#000"/>
      <g clip-path="url(#tela)">
        <rect x="65" y="8" width="60" height="14" rx="7" fill="#0B0B0C"/>
        <rect x="20" y="34" width="150" height="62" rx="12" fill="url(#hero)"/>
        <circle cx="160" cy="40" r="34" fill="#FFFFFF" fill-opacity=".08"/>
        <text x="32" y="84" class="t" font-size="17" font-weight="700" font-style="italic" fill="#F2F2F2">Cardápio</text>

        <g class="t" font-size="10">
          <rect x="20" y="106" width="50" height="20" rx="10" fill="#F2F2F2"/><text x="45" y="120" text-anchor="middle" font-weight="700" fill="#000">Drinks</text>
          <rect x="76" y="106" width="58" height="20" rx="10" fill="#1A1A1D"/><text x="105" y="120" text-anchor="middle" fill="#9A9A9A">Cervejas</text>
          <rect x="140" y="106" width="54" height="20" rx="10" fill="#1A1A1D"/><text x="167" y="120" text-anchor="middle" fill="#9A9A9A">Combos</text>
        </g>

        <g class="t">
          <rect x="20" y="140" width="44" height="44" rx="10" fill="url(#t1)"/>
          <text x="74" y="154" font-size="12" font-weight="700" fill="#F2F2F2">Spritz da casa</text>
          <text x="74" y="168" font-size="9.5" fill="#8C8C8C">Aperol e espumante</text>
          <text x="74" y="182" class="m" font-size="11" fill="#F2F2F2">R$ 34,00</text>

          <rect x="20" y="196" width="44" height="44" rx="10" fill="url(#t2)"/>
          <text x="74" y="210" font-size="12" font-weight="700" fill="#F2F2F2">Gin tônica</text>
          <text x="74" y="224" font-size="9.5" fill="#8C8C8C">Pepino e limão</text>
          <text x="74" y="238" class="m" font-size="11" fill="#F2F2F2">R$ 32,00</text>

          <rect x="20" y="252" width="44" height="44" rx="10" fill="url(#t3)"/>
          <text x="74" y="266" font-size="12" font-weight="700" fill="#F2F2F2">Balde long neck</text>
          <text x="74" y="280" font-size="9.5" fill="#8C8C8C">6 unidades geladas</text>
          <text x="74" y="294" class="m" font-size="11" fill="#F2F2F2">R$ 120,00</text>

          <rect x="20" y="308" width="44" height="44" rx="10" fill="url(#t4)"/>
          <text x="74" y="322" font-size="12" font-weight="700" fill="#F2F2F2">Caipirinha</text>
          <text x="74" y="336" font-size="9.5" fill="#8C8C8C">Limão ou morango</text>
          <text x="74" y="350" class="m" font-size="11" fill="#F2F2F2">R$ 26,00</text>
        </g>
      </g>
    </g>
  </g>
  <rect x=".5" y=".5" width="599" height="419" rx="28" fill="none" stroke="#2B2B30"/>
</svg>
